# .github/workflows/tests.yml
# Runs the test suite (including doctest-modules for PyCodeCommenter/) and
# the style and documentation-quality checks on every push and pull request
# against main.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

  lint-and-docs:
    name: style and documentation quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: flake8

      # The package documents itself with its own tool: no validation
      # errors, no leftover TODO(pycodecommenter) gaps, and (strictly
      # counted) at least 90% of functions and classes documented.
      - name: Validate the package's own docstrings
        run: pycodecommenter validate PyCodeCommenter --fail-on-todo

      - name: Check the package's docstring coverage
        run: pycodecommenter coverage PyCodeCommenter --strict --fail-below 90
