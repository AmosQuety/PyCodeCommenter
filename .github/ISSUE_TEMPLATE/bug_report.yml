name: Bug report
description: Something PyCodeCommenter did wrongly, or a check that reports a false problem.
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the output or the wrong docstring.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Smallest code that shows it
      description: A few lines of Python and the command you ran, for example `pycodecommenter validate example.py`.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Python
      description: The output of `pycodecommenter --version`, and your Python version and operating system.
    validations:
      required: true
