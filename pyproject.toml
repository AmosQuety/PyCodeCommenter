[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pycodecommenter"
version = "v2.2.0"

description = "Automatically generate, validate, and measure Google-style Python docstrings. Deterministic AST-based docstring generator and validator with CI/CD integration, coverage reporting, and JSON output."
readme = "README.md"
authors = [
    {name = "Nabasa Amos(Amos Quety)", email = "amosnabasa4@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Documentation",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = [
    "docstring",
    "docstring-generator",
    "docstring-validator",
    "documentation",
    "documentation-coverage",
    "google-style-docstrings",
    "python-documentation",
    "ast",
    "static-analysis",
    "code-quality",
    "developer-tools",
    "ci-cd",
    "pre-commit",
    "validation",
    "coverage",
    "type-hints",
    "linter",
    "automation",
    "python",
    "cli",
]
requires-python = ">=3.9"
dependencies = ["ruamel.yaml>=0.17", "libcst>=1.1"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/AmosQuety/PyCodeCommenter"
Documentation = "https://amosquety.github.io/PyCodeCommenter/"
Repository = "https://github.com/AmosQuety/PyCodeCommenter"
"Bug Tracker" = "https://github.com/AmosQuety/PyCodeCommenter/issues"

[tool.setuptools]
packages = ["PyCodeCommenter"]

[project.scripts]
pycodecommenter = "PyCodeCommenter.cli:main"
