[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pycodecommenter"
version = "2.6.1"

description = "Write, validate and measure Python docstrings from your code's AST: deterministic by default, with optional, labelled AI drafting."
readme = "README.md"
authors = [
    {name = "Nabasa Amos", email = "amosnabasa4@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Documentation",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = [
    "docstring",
    "docstring-generator",
    "docstring-validator",
    "documentation",
    "documentation-coverage",
    "google-style-docstrings",
    "python-documentation",
    "ast",
    "static-analysis",
    "code-quality",
    "developer-tools",
    "ci-cd",
    "pre-commit",
    "validation",
    "coverage",
    "type-hints",
    "linter",
    "automation",
    "python",
    "cli",
]
requires-python = ">=3.10"
dependencies = ["ruamel.yaml>=0.17", "libcst>=1.1"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.17",
    "mypy>=2.0",
    "pre-commit>=3.5",
]
# SDKs for --ai-draft with your own key (--ai-provider). Lower bounds are
# the versions the provider code was verified against.
gemini = ["google-genai>=2.25"]
openai = ["openai>=3.19"]
anthropic = ["anthropic>=1.8"]
ai = ["google-genai>=2.25", "openai>=3.19", "anthropic>=1.8"]

[project.urls]
Homepage = "https://github.com/AmosQuety/PyCodeCommenter"
Documentation = "https://amosquety.github.io/PyCodeCommenter/"
Repository = "https://github.com/AmosQuety/PyCodeCommenter"
Issues = "https://github.com/AmosQuety/PyCodeCommenter/issues"
Changelog = "https://github.com/AmosQuety/PyCodeCommenter/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["PyCodeCommenter"]

[tool.setuptools.package-data]
PyCodeCommenter = ["py.typed"]

[project.scripts]
pycodecommenter = "PyCodeCommenter.cli:main"

[tool.pytest.ini_options]
# Tests live in tests/; the package's docstring examples and the runnable
# examples in docs/python-api.md run as doctests.
testpaths = ["tests", "PyCodeCommenter", "docs/python-api.md"]
addopts = "--doctest-modules --doctest-glob=*.md"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["scratch"]

[tool.ruff.lint]
# pycodestyle errors and warnings, Pyflakes, import sorting and bugbear.
select = ["E", "W", "F", "I", "B"]

[tool.ruff.format]
# The Python examples in the docs run as doctests; leave them as written.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.10"
files = ["PyCodeCommenter"]
warn_unused_ignores = true
warn_redundant_casts = true
# Each module imports its siblings relative-first with an absolute fallback
# (so it also runs as a standalone script). mypy reads the fallback branch as
# a second definition of every imported name, so that check is off.
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
# The absolute-import fallback names (see above); the relative import is the
# one mypy checks.
module = [
    "ai_drafting", "ai_setup", "class_outline", "code_facts", "comment_docs",
    "commenter", "consent", "coverage", "description_provider",
    "direct_providers", "doc_styles", "docstring_parser", "draft_limits",
    "function_doc", "inference", "param_utils", "progress", "remote_provider",
    "review", "run_report", "secret_scan", "type_analyzer", "validator",
]
ignore_missing_imports = true
follow_imports = "skip"
