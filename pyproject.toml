[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pycodecommenter"
version = "2.6.0"

description = "Write, validate and measure Python docstrings from your code's AST: deterministic by default, with optional, labelled AI drafting."
readme = "README.md"
authors = [
    {name = "Nabasa Amos", email = "amosnabasa4@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Documentation",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
keywords = [
    "docstring",
    "docstring-generator",
    "docstring-validator",
    "documentation",
    "documentation-coverage",
    "google-style-docstrings",
    "python-documentation",
    "ast",
    "static-analysis",
    "code-quality",
    "developer-tools",
    "ci-cd",
    "pre-commit",
    "validation",
    "coverage",
    "type-hints",
    "linter",
    "automation",
    "python",
    "cli",
]
requires-python = ">=3.10"
dependencies = ["ruamel.yaml>=0.17", "libcst>=1.1"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=26.0",
    "flake8>=7.0",
    "pre-commit>=3.5",
]
# SDKs for --ai-draft with your own key (--ai-provider). Lower bounds are
# the versions the provider code was verified against.
gemini = ["google-genai>=2.25"]
openai = ["openai>=3.19"]
anthropic = ["anthropic>=1.8"]
ai = ["google-genai>=2.25", "openai>=3.19", "anthropic>=1.8"]

[project.urls]
Homepage = "https://github.com/AmosQuety/PyCodeCommenter"
Documentation = "https://amosquety.github.io/PyCodeCommenter/"
Repository = "https://github.com/AmosQuety/PyCodeCommenter"
Issues = "https://github.com/AmosQuety/PyCodeCommenter/issues"
Changelog = "https://github.com/AmosQuety/PyCodeCommenter/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["PyCodeCommenter"]

[project.scripts]
pycodecommenter = "PyCodeCommenter.cli:main"

[tool.pytest.ini_options]
# Tests live in tests/; the package's docstring examples run as doctests.
testpaths = ["tests", "PyCodeCommenter"]
addopts = "--doctest-modules"
pythonpath = ["."]

[tool.black]
# Explicit, so formatting doesn't depend on which Python runs Black.
target-version = ["py310", "py311", "py312", "py313"]
